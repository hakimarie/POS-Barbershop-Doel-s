<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Offline — KetemuTerus Barber POS</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f8fb;color:#172033;font:16px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(100%,440px);padding:32px;border:1px solid #e8ebf1;border-radius:20px;background:#fff;text-align:center}.mark{width:64px;height:64px;margin:0 auto 20px;border-radius:18px;background:#111827;display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px}.muted{color:#667085;font-size:14px}button{margin-top:16px;padding:12px 18px;border:0;border-radius:10px;background:#2563eb;color:#fff;font:inherit;font-weight:650}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">KT</div>
    <h1>Koneksi internet terputus</h1>
    <p class="muted">Halaman ini belum tersedia secara offline. Sambungkan kembali perangkat ke internet, lalu coba lagi.</p>
    <p class="muted">Jangan menganggap transaksi berhasil sebelum statusnya terkonfirmasi di POS.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
  </main>
</body>
</html>
